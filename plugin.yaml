name: provider-quota
version: 1.0.0
description: Provider quota + live-session broker for your gateway (quotas + activity for the providers Hermes has credentials for)
author: gabrielAHN
kind: standalone
platforms:
  - macos
# By default the provider set follows the gateway's Hermes credentials (the quota
# plugin's cache); PROVIDER_QUOTA_PROVIDERS (comma-separated "slug" or
# "slug=Label") pins an explicit set. See README.
config:
  env:
    - PROVIDER_QUOTA_PROVIDERS
